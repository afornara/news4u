name: Rassegna giornaliera

on:
  schedule:
    # GitHub usa l'orario UTC: due orari per coprire ora legale e ora solare.
    # Il giro parte alle 6:30 italiane, così il giornale è pronto verso le 7.
    - cron: "30 4 * * *"   # 6:30 in Italia con l'ora legale (fine marzo - fine ottobre)
    - cron: "30 5 * * *"   # 6:30 in Italia con l'ora solare (fine ottobre - fine marzo)
  workflow_dispatch:       # pulsante "Run workflow" per lanciarla a mano

permissions:
  contents: write

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  orario:
    runs-on: ubuntu-latest
    outputs:
      esegui: ${{ steps.check.outputs.esegui }}
    steps:
      - name: Controlla l'orario italiano
        id: check
        run: |
          OFFSET=$(TZ=Europe/Rome date +%z)
          SCHED="${{ github.event.schedule }}"
          if [ -z "$SCHED" ] \
             || { [ "$SCHED" = "30 4 * * *" ] && [ "$OFFSET" = "+0200" ]; } \
             || { [ "$SCHED" = "30 5 * * *" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "esegui=si" >> "$GITHUB_OUTPUT"
          else
            echo "esegui=no" >> "$GITHUB_OUTPUT"
            echo "Oggi in Italia vale l'altro orario: questo turno viene saltato."
          fi

  build:
    needs: orario
    if: needs.orario.outputs.esegui == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera la rassegna
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python build.py

      - name: Salva e pubblica
        run: |
          git config user.name "rassegna-bot"
          git config user.email "rassegna-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Rassegna $(date -u +%F)"
          git push
