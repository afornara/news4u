<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>News4u</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,800;1,8..60,400;1,8..60,600&family=Libre+Franklin:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --paper:#F7F6F2; --ink:#141414; --soft:#4A4A4A; --rule:#141414; --hair:#C9C7C0;
  --mast:"UnifrakturMaguntia", "Old English Text MT", serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Libre Franklin", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#121212; --ink:#ECEAE4; --soft:#A8A6A0; --rule:#ECEAE4; --hair:#3A3A3A; }
}
:root[data-theme="dark"]{ --paper:#121212; --ink:#ECEAE4; --soft:#A8A6A0; --rule:#ECEAE4; --hair:#3A3A3A; }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
a:hover h2,a:hover h3,a:hover .tt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{max-width:1180px;margin:0 auto;padding:0 24px 48px}

/* ---------- Testata ---------- */
.ears{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--soft);padding:18px 0 4px}
.mast{text-align:center;padding:4px 0 10px}
.mast h1{font-family:var(--mast);font-weight:400;font-size:clamp(3.4rem,13vw,8.5rem);line-height:.95;margin:0;letter-spacing:.005em;cursor:pointer}
.motto{font-style:italic;color:var(--soft);font-size:.95rem;margin:6px 0 0}
.rule-double{border:0;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);height:6px;margin:10px 0 0}
nav.sections{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 0;border-bottom:1px solid var(--rule);padding:8px 0}
nav.sections button{font-family:var(--sans);font-weight:500;font-size:.85rem;background:none;border:0;color:var(--ink);padding:4px 12px;cursor:pointer;border-left:1px solid var(--hair)}
nav.sections button:first-child{border-left:0}
nav.sections button[aria-current="true"]{font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.search{display:flex;justify-content:center;padding:10px 0 0}
.search input{font:inherit;font-family:var(--sans);font-size:.88rem;width:min(360px,100%);padding:7px 10px;border:1px solid var(--hair);background:transparent;color:var(--ink);border-radius:0}

/* ---------- Prima pagina ---------- */
.kicker{font-family:var(--sans);font-weight:700;font-size:.74rem;letter-spacing:.04em;display:block;margin-bottom:6px}
.byline{font-family:var(--sans);font-size:.76rem;color:var(--soft);margin-top:8px}
.byline .new{font-weight:700;color:var(--ink);margin-right:8px}
figure{margin:0 0 10px}
figure .ph{display:block;width:100%;aspect-ratio:3/2;overflow:hidden;background:var(--hair);color:var(--ink)}
figure .ph img,figure .ph svg{display:block;width:100%;height:100%;object-fit:cover}
figure .ph img{filter:grayscale(1) contrast(1.06)}
@media (prefers-reduced-motion:no-preference){figure .ph img{transition:filter .4s}}
a:hover figure .ph img{filter:none}
p.sum{margin:0;hyphens:auto;text-align:justify;text-justify:inter-word}

.top{display:grid;grid-template-columns:2fr 1px 1fr;gap:0 28px;padding:22px 0 24px;border-bottom:3px solid var(--rule)}
.vr{background:var(--hair)}
.lead h2{font-weight:800;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.04;letter-spacing:-.015em;margin:0 0 14px;font-variation-settings:"opsz" 60}
.lead p.sum{font-size:1.08rem;line-height:1.55;columns:2;column-gap:24px}
.lead p.sum::first-letter{font-weight:800;font-size:3.3em;float:left;line-height:.82;padding:4px 8px 0 0}

.trends h3.box{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.35rem;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.trends .src-note{font-family:var(--sans);font-size:.72rem;color:var(--soft);margin:0 0 6px}
.trends ol{list-style:none;margin:0;padding:0;counter-reset:t}
.trends li{counter-increment:t;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--hair)}
.trends li::before{content:counter(t);font-weight:800;font-size:1.5rem;line-height:1}
.trends .tt{font-weight:700;font-size:1.02rem;line-height:1.25}
.trends .byline{margin-top:4px}

.second{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:20px 0 22px;border-bottom:1px solid var(--rule)}
.second article{padding:0 22px;border-left:1px solid var(--hair)}
.second article:first-child{padding-left:0;border-left:0}
.second article:last-child{padding-right:0}
.second h3{font-weight:700;font-size:1.32rem;line-height:1.15;margin:0 0 8px}
.second p.sum{font-size:.95rem;line-height:1.5}

/* ---------- Pagine di settore in prima ---------- */
.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding-top:6px}
.desk section{padding:16px 22px 18px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.desk section:nth-child(3n+1){padding-left:0;border-left:0}
.desk section:nth-child(3n){padding-right:0}
.desk h2.sec{font-style:italic;font-weight:600;font-size:1.5rem;margin:0 0 10px;padding-top:6px;border-top:3px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
.desk h2.sec button{font-family:var(--sans);font-style:normal;font-size:.75rem;font-weight:500;background:none;border:0;color:var(--soft);cursor:pointer;padding:0}
.desk h2.sec button:hover{color:var(--ink);text-decoration:underline}
.brief{display:block;padding:10px 0;border-top:1px solid var(--hair)}
.brief:first-of-type{border-top:0;padding-top:0}
.brief h3{font-weight:700;font-size:1.08rem;line-height:1.22;margin:0 0 5px}
.brief p.sum{font-size:.92rem;line-height:1.48;color:var(--ink)}
.brief.first h3{font-size:1.28rem}

/* ---------- Vista settore ---------- */
.secpage-head{text-align:center;padding:26px 0 10px;border-bottom:3px solid var(--rule)}
.secpage-head h2{font-style:italic;font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);margin:0;line-height:1}
.secpage-head p{font-family:var(--sans);font-size:.8rem;color:var(--soft);margin:8px 0 0}
.grid-list{columns:3 280px;column-gap:28px;column-rule:1px solid var(--hair);padding-top:20px}
.grid-list .item{break-inside:avoid;display:block;padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
.grid-list h3{font-weight:700;font-size:1.25rem;line-height:1.18;margin:0 0 7px}
.grid-list p.sum{font-size:.95rem}

.empty{text-align:center;font-style:italic;color:var(--soft);padding:60px 0}
footer{margin-top:28px;border-top:3px double var(--rule);padding-top:12px;font-family:var(--sans);font-size:.76rem;color:var(--soft);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:900px){
  .top{grid-template-columns:1fr;gap:22px 0}
  .vr{display:none}
  .second,.desk{grid-template-columns:1fr 1fr}
  .second article:nth-child(3){display:none}
  .second article:nth-child(2){padding-right:0}
  .desk section{padding:16px 0 18px;border-left:0}
  .desk section:nth-child(odd){padding-right:16px;border-right:1px solid var(--hair)}
  .desk section:nth-child(even){padding-left:16px}
}
@media (max-width:620px){
  body{font-size:16px}
  .page{padding:0 16px 40px}
  .ears span:last-child{display:none}
  .lead p.sum{columns:1}
  .second,.desk{grid-template-columns:1fr}
  .second article,.second article:nth-child(3){display:block;padding:14px 0;border-left:0;border-top:1px solid var(--hair)}
  .second article:first-child{border-top:0;padding-top:0}
  .desk section,.desk section:nth-child(odd),.desk section:nth-child(even){padding:16px 0;border-right:0}
  nav.sections{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav.sections::-webkit-scrollbar{display:none}
  nav.sections button{flex:0 0 auto}
  p.sum{text-align:left}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="ears"><span id="date"></span><span id="count"></span></div>
    <div class="mast"><h1 id="title" title="Torna alla prima pagina">News4u</h1><p class="motto">Le notizie che contano, ogni mattina</p></div>
    <hr class="rule-double">
    <nav class="sections" id="nav" aria-label="Sezioni"></nav>
    <div class="search"><input id="q" type="search" placeholder="Cerca nel giornale" aria-label="Cerca nel giornale"></div>
  </header>
  <main id="main"></main>
  <footer><span id="upd"></span><span>Riassunti generati automaticamente dalle fonti citate. Apri l'articolo per il testo completo.</span></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const D = DATA || {title:"News4u", updated:"", date_long:"", sections:[], news:[]};
const SEC = Object.fromEntries(D.sections.map(s=>[s.id,s]));
const TREND = "tendenze";
const latest = D.news.length ? D.news.reduce((a,n)=>n.added>a?n.added:a, "") : null;
const bySec = {}; D.sections.forEach(s=>bySec[s.id]=D.news.filter(n=>n.section===s.id));
let view = "prima";

/* copertine in bianco e nero per gli articoli senza foto */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=seed||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%10000)/10000}}
function cover(motif,title){
  const r=rng(hash(title)),c="currentColor",W=300,H=200;let g="";const op=(a,b)=>(a+r()*(b-a)).toFixed(2);
  switch(motif){
    case "rays":{const cx=60+r()*180,cy=40+r()*120;for(let i=0;i<26;i++){const a=i/26*6.283,L=40+r()*170;g+=`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*L).toFixed(1)}" y2="${(cy+Math.sin(a)*L).toFixed(1)}" stroke="${c}" stroke-width="${op(1,3)}" stroke-opacity="${op(.3,.9)}"/>`}break}
    case "rings":{for(let j=0;j<2;j++){const cx=40+r()*220,cy=30+r()*140;for(let i=1;i<8;i++)g+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${i*13}" fill="none" stroke="${c}" stroke-opacity="${(0.85-i*0.1).toFixed(2)}" stroke-width="1.5"/>`}break}
    case "tiles":{for(let y=0;y<4;y++)for(let x=0;x<6;x++){if(r()<.3)continue;g+=`<rect x="${12+x*48}" y="${12+y*46}" width="38" height="36" fill="${c}" fill-opacity="${op(.1,.85)}"/>`}break}
    case "bars":{const n=14,w=W/n;for(let i=0;i<n;i++){const h=30+r()*150;g+=`<rect x="${(i*w+3).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(w-6).toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" fill-opacity="${op(.25,.9)}"/>`}break}
    case "water":{for(let i=0;i<10;i++){const y=14+i*19,a=5+r()*12,f=1+r()*2,ph=r()*6;let d=`M0 ${y}`;for(let x=0;x<=W;x+=10)d+=` L${x} ${(y+Math.sin(x/W*6.283*f+ph)*a).toFixed(1)}`;g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${op(1,3)}" stroke-opacity="${op(.3,.9)}"/>`}break}
    case "tri":{for(let i=0;i<12;i++){const x=r()*W,y=r()*H,s=20+r()*55,a=r()*6.283;g+=`<polygon points="${[0,1,2].map(k=>(x+Math.cos(a+k*2.094)*s).toFixed(1)+","+(y+Math.sin(a+k*2.094)*s).toFixed(1)).join(" ")}" fill="${c}" fill-opacity="${op(.1,.7)}"/>`}break}
    case "glitch":{for(let y=0;y<H;y+=9){if(r()<.35)continue;let x=r()*50;while(x<W){const w=6+r()*60;if(r()<.6)g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="6" fill="${c}" fill-opacity="${op(.2,.9)}"/>`;x+=w+4+r()*18}}break}
    default:{const p=[];for(let i=0;i<14;i++)p.push([15+r()*270,15+r()*170]);p.forEach((a,i)=>{const b=p[(i*5+3)%14];g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-opacity=".35"/>`});p.forEach(a=>g+=`<circle cx="${a[0]}" cy="${a[1]}" r="${(3+r()*8).toFixed(1)}" fill="${c}" fill-opacity="${op(.3,.9)}"/>`)}
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="${c}" fill-opacity=".06"/>${g}</svg>`;
}

/* piccoli costruttori di DOM: il testo passa sempre da textContent */
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function link(n,cls){const a=el("a",cls);a.href=n.u;a.target="_blank";a.rel="noopener";return a}
function figure(n){
  const f=el("figure"),ph=el("span","ph");
  if(n.img){const im=document.createElement("img");im.src=n.img;im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";im.onerror=()=>{ph.innerHTML=cover(SEC[n.section]?.motif,n.t)};ph.append(im)}
  else ph.innerHTML=cover(SEC[n.section]?.motif,n.t);
  f.append(ph);return f;
}
function byline(n){
  const b=el("div","byline");
  if(n.added===latest){b.append(el("span","new","Nuova"))}
  b.append(document.createTextNode([n.src,n.m,n.d].filter(Boolean).join(", ")));
  return b;
}
const term=()=>document.getElementById("q").value.trim().toLowerCase();
const match=n=>{const t=term();return !t||(n.t+" "+n.s+" "+n.src).toLowerCase().includes(t)};

/* ordine di importanza: prima il giorno più recente, poi la posizione decisa dal modello */
const secIndex=Object.fromEntries(D.sections.map((s,i)=>[s.id,i]));
const rankSort=(a,b)=>(b.added>a.added?1:b.added<a.added?-1:0)||((a.r??9)-(b.r??9))||(secIndex[a.section]-secIndex[b.section])||(b.published>a.published?1:b.published<a.published?-1:0);

function nav(){
  const n=document.getElementById("nav");n.innerHTML="";
  const items=[["prima","Prima pagina"],...D.sections.map(s=>[s.id,s.name])];
  items.forEach(([id,label])=>{const b=el("button",null,label);b.type="button";b.setAttribute("aria-current",String(view===id));b.onclick=()=>go(id);n.append(b)});
}
function go(id){view=id;render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

function frontPage(main){
  const regular=D.sections.filter(s=>s.id!==TREND);
  const used=new Set();
  // apertura: la notizia principale del giorno, preferendo quelle con foto
  const tops=regular.map(s=>(bySec[s.id]||[]).filter(match).sort(rankSort)[0]).filter(Boolean).sort(rankSort);
  const lead=tops.find(n=>n.img)||tops[0];
  if(!lead){main.append(el("p","empty",D.news.length?"Nessun articolo corrisponde alla ricerca.":"Il giornale di oggi non è ancora uscito: avvia il workflow “Rassegna giornaliera” su GitHub."));return}
  used.add(lead.id);

  const top=el("div","top");
  const la=link(lead,"lead");
  la.append(el("span","kicker",SEC[lead.section].name),el("h2",null,lead.t),figure(lead),el("p","sum",lead.s),byline(lead));
  top.append(la,el("div","vr"));

  const tr=el("aside","trends");
  tr.append(el("h3","box",SEC[TREND]?.name||"In tendenza"),el("p","src-note","Le discussioni tech più seguite in rete"));
  const ol=el("ol");
  (bySec[TREND]||[]).filter(match).sort(rankSort).slice(0,7).forEach(n=>{used.add(n.id);const li=el("li"),a=link(n);a.append(el("div","tt",n.t),byline(n));li.append(a);ol.append(li)});
  if(!ol.children.length){const li=el("li");li.append(el("div","byline","Nessun argomento in tendenza oggi."));ol.append(li)}
  tr.append(ol);top.append(tr);
  main.append(top);

  // tre notizie di spalla dagli altri settori
  const second=el("div","second");
  tops.filter(n=>!used.has(n.id)&&n.section!==lead.section).slice(0,3).forEach(n=>{
    used.add(n.id);const a=link(n),art=el("article");
    a.append(el("span","kicker",SEC[n.section].name),figure(n),el("h3",null,n.t),el("p","sum",n.s),byline(n));art.append(a);second.append(art);
  });
  if(second.children.length)main.append(second);

  // il resto, settore per settore
  const desk=el("div","desk");
  regular.forEach(s=>{
    const list=(bySec[s.id]||[]).filter(n=>!used.has(n.id)&&match(n)).sort(rankSort).slice(0,4);
    if(!list.length)return;
    const sec=el("section"),h=el("h2","sec",s.name),more=el("button",null,"Tutta la sezione");more.type="button";more.onclick=()=>go(s.id);h.append(more);sec.append(h);
    list.forEach((n,i)=>{const a=link(n,"brief"+(i===0?" first":""));a.append(el("h3",null,n.t));if(i<2)a.append(el("p","sum",n.s));a.append(byline(n));sec.append(a)});
    desk.append(sec);
  });
  if(desk.children.length)main.append(desk);
}

function sectionPage(main,id){
  const s=SEC[id],list=(bySec[id]||[]).filter(match).sort(rankSort);
  const head=el("div","secpage-head");head.append(el("h2",null,s.name),el("p",null,list.length===1?"1 articolo negli ultimi giorni":list.length+" articoli negli ultimi giorni"));main.append(head);
  if(!list.length){main.append(el("p","empty",term()?"Nessun articolo della sezione corrisponde alla ricerca.":"Nessun articolo in questa sezione."));return}
  const g=el("div","grid-list");
  list.forEach((n,i)=>{const a=link(n,"item");if(n.img||i<3)a.append(figure(n));a.append(el("h3",null,n.t),el("p","sum",n.s),byline(n));g.append(a)});
  main.append(g);
}

function render(){
  nav();const main=document.getElementById("main");main.innerHTML="";
  view==="prima"?frontPage(main):sectionPage(main,view);
}

document.getElementById("title").textContent=D.title||"News4u";
document.title=D.title||"News4u";
document.getElementById("date").textContent=D.date_long||D.updated||"";
const today=D.news.filter(n=>n.added===latest).length;
document.getElementById("count").textContent=today?`${today} notizie nuove oggi`:"";
document.getElementById("upd").textContent=D.updated?`Aggiornato il ${D.updated}`:"";
document.getElementById("title").addEventListener("click",()=>go("prima"));
document.getElementById("q").addEventListener("input",render);
render();
</script>
</body>
</html>
